<!DOCTYPE html>
<html>
<head>
  <title>Time Tracker</title>
</head>
<body>

<h2>Login</h2>

<input id="email" placeholder="Email"><br>
<input id="password" type="password" placeholder="Wachtwoord"><br><br>

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>

<hr>

<div id="app" style="display:none;">
  <button onclick="inklokken()">Inklokken</button>
  <button onclick="uitklokken()">Uitklokken</button>
  <button onclick="loadData()">Refresh</button>
  <button onclick="exportExcel()">Excel</button>

  <pre id="output"></pre>
</div>

<script>
let token = null;

function register() {
  fetch("/register", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      email: email.value,
      password: password.value
    })
  }).then(r => r.text()).then(alert);
}

function login() {
  fetch("/login", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      email: email.value,
      password: password.value
    })
  })
  .then(r => r.json())
  .then(data => {
    token = data.token;
    document.getElementById("app").style.display = "block";
    loadData();
  });
}

function authFetch(url, options={}) {
  options.headers = {
    ...(options.headers || {}),
    "Authorization": token
  };
  return fetch(url, options);
}

function inklokken() {
  authFetch("/inklokken", {method:"POST"});
}

function uitklokken() {
  authFetch("/uitklokken", {method:"POST"});
}

function loadData() {
  authFetch("/data")
    .then(r => r.json())
    .then(d => output.textContent = JSON.stringify(d, null, 2));
}

function exportExcel() {
  fetch("/export", {
    headers: { "Authorization": token }
  })
  .then(res => res.blob())
  .then(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "uren.xlsx";
    a.click();
  });
}
</script>

</body>
</html>
